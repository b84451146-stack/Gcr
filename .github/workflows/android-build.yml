name: Android build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Stable debug signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f android/debug.keystore ]; then
            keytool -genkeypair -keystore android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name github-actions
            git config user.email actions@github.com
            git add android/debug.keystore
            git commit -m "Add debug keystore"
            git push
          fi
          cp android/debug.keystore ~/.android/debug.keystore
          echo '## SHA-1 for Firebase' >> "$GITHUB_STEP_SUMMARY"
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep -E 'SHA1|SHA256' >> "$GITHUB_STEP_SUMMARY"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Add Firebase config
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GSJ" ]; then echo "SECRET IS EMPTY"; exit 1; fi
          echo "$GSJ" > android/app/google-services.json
          ls -l android/app/google-services.json
          grep -c package_name android/app/google-services.json
      - name: Build
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
