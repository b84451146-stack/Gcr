name: Unzip project
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir /tmp/x && unzip -q gcr-eco-tracker.zip -d /tmp/x
          cd /tmp/x
          if [ "$(ls | wc -l)" = "1" ] && [ -d "$(ls)" ]; then cd "$(ls)"; fi
          rm -rf .github
          cp -r . "$GITHUB_WORKSPACE"/
          cd "$GITHUB_WORKSPACE"
          rm gcr-eco-tracker.zip
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "Unzip project"
          git push
